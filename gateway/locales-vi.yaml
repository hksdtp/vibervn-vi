    session_storage_unavailable: ⚠️ Bộ nhớ lưu phiên tạm thời không khả dụng, nên lượt này đã dừng để bảo vệ lịch sử trò chuyện của bạn. Tin nhắn của bạn có lẽ đã được lưu — hãy đợi một lát rồi gửi lại.
