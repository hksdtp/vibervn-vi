        **Bước 1 (chỉ một lần, trên máy chủ):** tạo thông tin đăng nhập OAuth client tại https://console.cloud.google.com/apis/credentials → *Create credentials* → *OAuth client ID* → *Desktop app*. Tải tệp JSON xuống. Sau đó chạy trên máy chủ:

        ```

        python -m plugins.platforms.google_chat.oauth --client-secret /path/to/client_secret.json

        ```

        **Bước 2:** quay lại đây và gửi `/setup-files start`.'
      start_instructions: '1. Mở URL này trong trình duyệt và cấp quyền:

