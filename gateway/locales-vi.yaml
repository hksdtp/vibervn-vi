      not_authorized_yet: 🔧 Đã lưu thông tin xác thực của ứng dụng, nhưng bạn chưa cấp quyền. Gửi `/setup-files start` để bắt đầu.
      no_client_credentials: ⚠️ Chưa lưu thông tin xác thực của ứng dụng cho hồ sơ này. Gửi `/setup-files` (không có tham số) để xem hướng dẫn thiết lập.
