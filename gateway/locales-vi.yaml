explainer:
  no_reply_prefix: '⚠️ Không có phản hồi: '
  empty_response: '{model} không trả lời lần này dù đã thử lại. Gửi `continue` để thử lại, hoặc đổi model bằng /model.'
  exit:
    all_retries_exhausted_no_response: nhà cung cấp model không phản hồi sau tất cả các lần thử. Gửi /retry hoặc đổi model bằng /model.
    partial_stream_recovery: luồng phản hồi dừng sớm và chỉ khôi phục được một phần nội dung. Gửi `continue` để tiếp tục từ chỗ dừng.
    fallback_prior_turn_content: lượt này không tạo ra nội dung mới; đang hiển thị ngữ cảnh trước đó đã khôi phục. Gửi `continue` để thử lại.
    redirect_restart_limit_exceeded: yêu cầu bị hủy bởi một chỉnh sửa mới ở mỗi lần thử, nên lượt này đã dừng thay vì thử lại mãi. Chỉnh sửa cuối của bạn đã được xếp làm tin nhắn tiếp theo.
    rebuilt_restart_limit_exceeded: mọi nhà cung cấp trong chuỗi dự phòng đều tiếp tục lỗi, nên lượt này đã dừng thay vì thử lại mãi. Gửi `continue` hoặc đổi nhà cung cấp.
    budget_exhausted: đã hết ngân sách lượt lặp/chi phí cho lượt này trước khi có câu trả lời cuối cùng. Gửi `continue` để tiếp tục.
    ollama_runtime_context_too_small: cửa sổ ngữ cảnh của model chạy cục bộ quá nhỏ để hoàn tất. Tăng kích thước ngữ cảnh hoặc dùng model lớn hơn.
    pending_tool_result: lượt này dừng khi vẫn đang chờ kết quả công cụ và model không tạo thêm nội dung. Gửi `continue` để model tóm tắt.
    interrupted_during_api_call: yêu cầu bị gián đoạn giữa lúc gọi API, trước khi nhận được phản hồi. Gửi `continue` để thử lại.
    max_iterations_reached: đã chạm giới hạn số vòng lặp công cụ trước khi có câu trả lời cuối. Gửi `continue` để tiếp tục, hoặc tăng `max_iterations`.
    error_near_max_iterations: đã xảy ra lỗi gần giới hạn số vòng lặp, trước khi có câu trả lời cuối. Kiểm tra đầu ra của công cụ ở trên, rồi gửi `continue`.
    repeated_outer_errors: lượt này liên tục gặp lỗi nên đã dừng sớm thay vì thử lại mãi. Kiểm tra các lỗi ở trên, rồi gửi `continue` để thử lại.
  persistence:
    compression: lượt này đã dừng vì một tiến trình khác đang nén phiên này. Tin nhắn của bạn có lẽ đã được lưu — hãy gửi lại sau khi nén xong.
    compression_closed: lượt này đã dừng vì phiên được chuyển sang phiên mới khi nén ngữ cảnh và không thể tiếp tục lượt đang chạy. Dữ liệu lưu trữ vẫn bình thường — tải lại ứng dụng (hoặc bắt đầu lượt mới) để nhận ID phiên mới, rồi gửi lại tin nhắn.
    turn_lease: lượt này đã dừng vì một tiến trình ViberVN Bot khác đã tiếp quản phiên này. Phản hồi của bạn chưa được lưu — hãy đợi tiến trình kia hoàn tất rồi gửi lại tin nhắn.
    session_row_missing: phiên này bị xóa khỏi bộ lưu trữ khi cuộc trò chuyện vẫn đang mở, và ViberVN Bot không thể tạo lại, nên tin nhắn này chưa được lưu. Hãy gửi lại; nếu vẫn lỗi, chạy `vibervnbot {profile_arg}doctor`.
    locked: lượt này đã dừng vì bộ lưu trữ phiên đang bận (một tiến trình ViberVN Bot khác đang ghi vào cơ sở dữ liệu trạng thái). Tin nhắn của bạn có lẽ đã được lưu — hãy đợi một lát rồi gửi lại.
    replaced: tệp cơ sở dữ liệu phiên đã bị thay thế khi ViberVN Bot đang chạy, nên tin nhắn này chưa được lưu (có một bản sao trong {home}/sessions/). Dừng ViberVN Bot (`vibervnbot {profile_arg}gateway stop`), chạy `vibervnbot {profile_arg}doctor` — không chạy `vibervnbot {profile_arg}doctor --fix`, vì lệnh đó sẽ sửa nhầm tệp tại chỗ — rồi khởi động lại và gửi lại tin nhắn. Các bước khôi phục nâng cao có trong log.
    deleted_wal: một tiến trình ViberVN Bot khác vẫn đang giữ bản cũ của nhật ký ghi trước của cơ sở dữ liệu phiên. ViberVN Bot đã dừng ghi để bảo vệ tệp, nên tin nhắn này chưa được lưu (một bản sao nằm trong {home}/sessions/). Không có gì bị mất. Hãy thoát mọi tiến trình ViberVN Bot trên profile này (ứng dụng Desktop, `vibervnbot {profile_arg}gateway stop`, dashboard, cron), chạy `vibervnbot {profile_arg}doctor` để xem tiến trình nào còn giữ nhật ký, rồi khởi động lại ViberVN Bot và gửi lại tin nhắn. Đừng chạy `doctor --fix` hoặc xóa bất kỳ tệp state.db nào khi các tiến trình đó còn chạy.
    corrupt: "lượt này đã dừng vì cơ sở dữ liệu trạng thái báo lỗi cấu trúc (nội dung cuộc trò chuyện sẽ bị mất khi khởi động lại). Giải phóng dung lượng ổ đĩa sẽ không giúp ích. Các cách khôi phục:\n1. Chạy `vibervnbot {profile_arg}doctor --fix`\n2. Dừng gateway, rồi khôi phục bằng:\n   vibervnbot {profile_arg}sessions recover --source {db_path} --inspect-only\n   (nếu báo có thể khôi phục) vibervnbot {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — công cụ sẽ tạo bản sao lưu của tệp bị hỏng trước khi khôi phục; KHÔNG chạy `sqlite3 ... \".recover\"` trên state.db đang được sử dụng, vì CLI sqlite3 có lỗ hổng có thể làm tệp hỏng thêm\n3. Khôi phục từ bản sao lưu trong {backups_dir}/\nSau đó gửi lại tin nhắn."
    fts_index: 'lượt này đã dừng vì chỉ mục tìm kiếm phiên (FTS5) bị hỏng và không thể tách ra, nên tin nhắn này chưa được lưu. Kho tin nhắn không bị hỏng: đừng dùng công cụ khôi phục hoặc khôi phục bản sao lưu. Chạy `vibervnbot {profile_arg}doctor --fix` (hoặc khởi động lại ViberVN Bot để sửa chỉ mục khi mở), rồi gửi lại tin nhắn.'
    disk: 'ViberVN Bot không lưu được cuộc trò chuyện này xuống ổ đĩa nên đã dừng để tránh mất tin nhắn của bạn. Có thể ổ đĩa đã đầy: hãy giải phóng dung lượng (hoặc sửa quyền truy cập {home}/state.db), rồi gửi lại tin nhắn.'
    default: ViberVN Bot không lưu được cuộc trò chuyện này nên đã dừng để tránh mất tin nhắn của bạn. Có thể ổ đĩa đã đầy hoặc một tiến trình ViberVN Bot khác đang giữ cơ sở dữ liệu. Hãy đóng các cửa sổ ViberVN Bot khác, chạy `vibervnbot {profile_arg}doctor` để kiểm tra bộ nhớ lưu trữ, rồi gửi lại tin nhắn.
  file_mutation:
    header: '⚠️ Trình kiểm tra chỉnh sửa tệp: {count} lần chỉnh sửa tệp THẤT BẠI trong lượt này, dù nội dung phía trên có thể nói khác. Chạy `git status` hoặc `read_file` để xác nhận những thay đổi nào thực sự đã được áp dụng.'
    entry: '  • `{path}` — [{tool}] {preview}'
    failed: thất bại
  shared:
    and_more: '  • … và thêm {count} mục nữa'
    the_model: Model
tips:
  t001: /bg <prompt> chạy tác vụ trong một phiên riêng để phiên hiện tại của bạn vẫn rảnh; /btw <question> trả lời câu hỏi bên lề về cuộc trò chuyện này mà không làm gián đoạn.
  t002: /branch tạo nhánh từ phiên hiện tại để bạn thử hướng khác mà không mất tiến độ.
  t003: /compress nén thủ công ngữ cảnh cuộc trò chuyện khi nội dung quá dài.
  t004: /rollback liệt kê các điểm khôi phục của hệ thống tệp — đưa các tệp mà agent đã sửa về trạng thái trước đó.
  t005: /rollback diff 2 xem trước những thay đổi kể từ điểm khôi phục 2 mà không khôi phục gì.
  t006: /rollback 2 src/file.py khôi phục một tệp từ điểm khôi phục cụ thể.
  t007: /title "my project" đặt tên cho phiên của bạn — sau này tiếp tục bằng /resume hoặc vibervnbot -c.
  t008: /resume tiếp tục một phiên đã được đặt tên từ chỗ bạn dừng.
  t009: /queue <prompt> xếp tin nhắn vào lượt tiếp theo mà không làm gián đoạn lượt hiện tại.
  t010: /undo xóa lượt trao đổi gần nhất giữa bạn và trợ lý khỏi cuộc trò chuyện.
  t011: /retry gửi lại tin nhắn gần nhất của bạn — hữu ích khi câu trả lời của agent chưa đúng ý.
  t012: '/verbose chuyển giữa các mức hiển thị tiến độ công cụ: off → new → all → verbose.'
  t013: /reasoning high tăng độ sâu suy luận của model. /reasoning show hiển thị quá trình suy luận.
  t014: /fast bật hoặc tắt xử lý ưu tiên để API phản hồi nhanh hơn (tùy nhà cung cấp).
  t015: /yolo bỏ qua mọi yêu cầu phê duyệt lệnh nguy hiểm trong phần còn lại của phiên.
  t016: /model cho phép bạn đổi model giữa phiên — thử /model sonnet hoặc /model gpt-5.
  t017: /model --global đổi model mặc định của bạn vĩnh viễn.
  t018: /personality pirate đặt một tính cách vui nhộn — có 14 lựa chọn sẵn, từ kawaii đến shakespeare.
  t019: /skin đổi giao diện CLI — thử ares, mono, slate, poseidon hoặc charizard.
  t020: /statusbar bật/tắt thanh hiển thị liên tục model, token, % ngữ cảnh đã dùng, chi phí và thời lượng.
  t021: /tools disable browser tạm thời tắt các công cụ trình duyệt trong phiên hiện tại.
  t022: /browser connect kết nối các công cụ trình duyệt với trình duyệt họ Chromium đang chạy của bạn qua CDP.
  t023: /plugins liệt kê các plugin đã cài và trạng thái của chúng.
  t024: /cron quản lý tác vụ theo lịch — đặt prompt lặp lại và gửi đến bất kỳ nền tảng nào.
  t025: /reload-mcp tải lại cấu hình máy chủ MCP mà không cần khởi động lại.
  t026: /usage cho biết lượng token đã dùng, chi tiết chi phí và thời lượng phiên.
  t027: /insights cho biết số liệu sử dụng trong 30 ngày qua.
  t028: /paste kiểm tra ảnh trong clipboard và đính kèm vào tin nhắn tiếp theo của bạn.
  t029: /profile cho biết profile đang dùng và thư mục chính của nó.
  t030: /config cho bạn xem nhanh cấu hình hiện tại.
  t031: /stop dừng mọi tiến trình nền đang chạy do agent khởi tạo.
  t032: '@file:path/to/file.py chèn nội dung file trực tiếp vào tin nhắn của bạn.'
  t033: '@file:main.py:10-50 chỉ chèn các dòng 10-50 của file.'
  t034: '@folder:src/ chèn danh sách cây thư mục.'
  t035: '@diff chèn các thay đổi git chưa đưa vào staging vào tin nhắn.'
  t036: '@staged chèn các thay đổi git đã đưa vào staging (git diff --staged).'
  t037: '@git:5 chèn 5 commit gần nhất cùng toàn bộ bản vá.'
  t038: '@url:https://example.com lấy và chèn nội dung trang web.'
  t039: Gõ @ để bật gợi ý đường dẫn trong hệ thống file — chọn file bạn cần ngay khi gõ.
  t040: 'Kết hợp nhiều tham chiếu: "Kiểm tra @file:main.py và @file:test.py xem có nhất quán không."'
  t041: Alt+Enter chèn dòng mới khi nhập nhiều dòng. (Windows Terminal chặn Alt+Enter — hãy dùng Ctrl+Enter thay thế.)
  t042: Ctrl+C ngắt agent. Nhấn hai lần trong vòng 2 giây để buộc thoát.
  t043: Ctrl+Z tạm dừng ViberVN Bot và đưa xuống chạy nền — chạy fg trong shell để tiếp tục.
  t044: Tab chấp nhận gợi ý nhập liệu hoặc tự hoàn thành lệnh bắt đầu bằng dấu gạch chéo.
  t045: Nhập tin nhắn mới khi agent đang làm việc để ngắt và đổi hướng nó.
  t046: Alt+V dán ảnh từ clipboard vào cuộc trò chuyện.
  t047: Dán từ 5 dòng trở lên sẽ tự lưu vào file và chèn một tham chiếu ngắn gọn thay thế.
  t048: vibervnbot -c tiếp tục phiên CLI gần nhất. vibervnbot -c "project name" tiếp tục phiên theo tiêu đề.
  t049: vibervnbot -w tạo một git worktree riêng biệt — rất hợp để chạy các quy trình agent song song.
  t050: 'vibervnbot -w -q "Fix issue #42" kết hợp worktree riêng biệt với một truy vấn chạy một lần.'
  t051: vibervnbot chat -t web,terminal chỉ bật các nhóm công cụ cụ thể để bạn tập trung vào phiên làm việc.
  t052: vibervnbot chat -s github-pr-workflow tải sẵn một skill khi khởi chạy.
  t053: vibervnbot chat -q "query" chạy một truy vấn không tương tác rồi thoát.
  t054: vibervnbot chat --max-turns 1000 thay giới hạn mặc định 500 lượt lặp cho mỗi lượt.
  t055: vibervnbot chat --checkpoints bật tính năng chụp nhanh hệ thống file trước mỗi thay đổi file có thể gây mất dữ liệu.
  t056: vibervnbot --yolo bỏ qua mọi yêu cầu phê duyệt lệnh nguy hiểm trong suốt phiên.
  t057: vibervnbot chat --source telegram gắn nhãn phiên để lọc trong vibervnbot sessions list.
  t058: vibervnbot -p work chat chạy với một hồ sơ cụ thể mà không đổi hồ sơ mặc định của bạn.
  t059: vibervnbot doctor --fix chẩn đoán và tự sửa lỗi cấu hình và các thành phần phụ thuộc.
  t060: vibervnbot dump xuất bản tóm tắt thiết lập ngắn gọn — rất tiện khi báo lỗi.
  t061: vibervnbot config set KEY VALUE tự chuyển thông tin bí mật vào .env và mọi thứ khác vào config.yaml.
  t062: vibervnbot config edit mở config.yaml bằng trình chỉnh sửa mặc định của bạn.
  t063: vibervnbot config check tìm các tùy chọn cấu hình bị thiếu hoặc đã lỗi thời.
  t064: vibervnbot sessions browse mở danh sách chọn phiên có chức năng tìm kiếm.
  t065: vibervnbot sessions stats hiển thị số phiên theo nền tảng và dung lượng cơ sở dữ liệu.
  t066: vibervnbot sessions prune --older-than 30 dọn dẹp các phiên cũ.
  t067: vibervnbot skills search react --source skills-sh tìm trong danh mục công khai của skills.sh.
  t068: vibervnbot skills check kiểm tra các skill đã cài từ hub xem có bản cập nhật từ nguồn không.
  t069: vibervnbot skills tap add myorg/skills-repo thêm một nguồn skill tùy chỉnh trên GitHub.
  t070: vibervnbot skills snapshot export setup.json xuất cấu hình skill của bạn để sao lưu hoặc chia sẻ.
  t071: vibervnbot mcp add github --command npx thêm máy chủ MCP qua dòng lệnh.
  t072: vibervnbot mcp-serve chạy chính ViberVN Bot dưới dạng máy chủ MCP cho các agent khác.
  t073: vibervnbot auth add cho phép bạn thêm nhiều khóa API để luân phiên sử dụng.
  t074: vibervnbot completion bash >> ~/.bashrc bật tự động hoàn thành bằng phím Tab cho mọi lệnh và profile.
  t075: vibervnbot logs -f theo dõi agent.log theo thời gian thực. --level WARNING --since 1h lọc kết quả.
  t076: vibervnbot backup tạo bản sao lưu dạng zip cho toàn bộ thư mục ViberVN Bot của bạn.
  t077: vibervnbot profile create coder tạo một profile riêng biệt, có thể dùng như một lệnh riêng.
  t078: vibervnbot profile create work --clone sao chép cấu hình và các khóa hiện tại của bạn sang profile mới.
  t079: vibervnbot update tự động đồng bộ các skill mới đi kèm vào TẤT CẢ profile.
  t080: vibervnbot gateway install thiết lập ViberVN Bot thành dịch vụ hệ thống (systemd/launchd).
  t081: vibervnbot memory setup cho phép bạn cấu hình nhà cung cấp bộ nhớ bên ngoài (Honcho, Mem0, v.v.).
  t082: vibervnbot webhook subscribe tạo các tuyến webhook kích hoạt theo sự kiện, có xác thực HMAC.
  t083: 'Tiết kiệm chi phí: vibervnbot tools tắt các công cụ không dùng, vibervnbot skills config tinh gọn danh sách skill.'
  t084: /reasoning low hoặc /reasoning minimal giảm độ sâu suy luận xuống dưới mức mặc định (medium) — phản hồi nhanh hơn, rẻ hơn.
  t085: vibervnbot models chuyển các tác vụ hình ảnh, nén và phụ trợ sang model rẻ hơn — giảm hơn 85% chi phí token nền mà không phải hạ cấp model chat chính của bạn.
  t086: 'Đặt display.bell_on_complete: true trong config.yaml để nghe tiếng chuông khi tác vụ dài hoàn tất.'
  t087: 'Đặt display.streaming: true để thấy token xuất hiện theo thời gian thực khi model tạo phản hồi.'
  t088: 'Đặt display.show_reasoning: true để xem quá trình suy luận của model.'
  t089: 'Đặt display.compact: true để giảm khoảng trắng trong kết quả, giúp thông tin gọn hơn.'
  t090: 'Đặt display.busy_input_mode: queue để xếp hàng tin nhắn thay vì ngắt agent, hoặc đặt steer để đưa tin nhắn vào khi agent đang chạy qua /steer.'
  t091: 'Đặt display.resume_display: minimal để bỏ qua phần tóm tắt đầy đủ cuộc trò chuyện khi tiếp tục phiên.'
  t092: 'Đặt compression.threshold: 0.50 để kiểm soát khi nào tự động nén (mặc định: 50% ngữ cảnh).'
  t093: 'Đặt agent.max_turns: 1000 để agent có thể gọi công cụ nhiều bước hơn trong mỗi lượt.'
  t094: 'Đặt file_read_max_chars: 200000 để tăng lượng nội dung tối đa cho mỗi lần gọi read_file.'
  t095: 'Đặt approvals.mode: smart để LLM tự duyệt lệnh an toàn và tự từ chối lệnh nguy hiểm.'
  t096: Đặt fallback_model trong config.yaml để tự động chuyển sang nhà cung cấp dự phòng khi có lỗi.
  t097: 'Đặt privacy.redact_pii: true để băm ID người dùng và số điện thoại trước khi gửi đến LLM.'
  t098: 'Đặt browser.headed: true để xem cửa sổ Chromium trên máy khi agent duyệt web.'
  t099: 'Đặt worktree: true trong config.yaml để luôn tạo git worktree (giống vibervnbot -w).'
  t100: 'Đặt security.website_blocklist.enabled: true để chặn các tên miền cụ thể trong công cụ web.'
  t101: 'Đặt cron.wrap_response: false để gửi trực tiếp đầu ra của agent, không kèm phần đầu/cuối của cron.'
  t102: VIBERVNBOT_TIMEZONE ghi đè múi giờ của máy chủ bằng bất kỳ chuỗi múi giờ IANA nào.
  t103: Bạn có thể thay thế biến môi trường trong config.yaml bằng cú pháp ${VAR_NAME}.
  t104: Các lệnh nhanh trong config.yaml chạy lệnh shell ngay lập tức mà không tốn token.
  t105: Bạn có thể định nghĩa tính cách tùy chỉnh trong config.yaml tại agent.personalities.
  t106: provider_routing kiểm soát việc sắp xếp, cho phép và chặn các nhà cung cấp OpenRouter.
  t107: execute_code chạy các script Python gọi công cụ ViberVN Bot bằng mã — kết quả không được đưa vào ngữ cảnh.
  t108: delegate_task mặc định tạo tối đa 10 agent con chạy đồng thời (delegation.max_concurrent_children), mỗi agent có ngữ cảnh riêng để làm việc song song.
  t109: web_extract dùng được với URL PDF — đưa vào bất kỳ liên kết PDF nào để chuyển thành markdown.
  t110: search_files dùng ripgrep và nhanh hơn grep — hãy dùng thay cho grep trong terminal.
  t111: patch dùng 9 cách khớp gần đúng, nên khác biệt nhỏ về khoảng trắng sẽ không làm hỏng bản chỉnh sửa.
  t112: patch hỗ trợ định dạng V4A để chỉnh sửa hàng loạt nhiều file trong một lần gọi.
  t113: read_file gợi ý tên file tương tự khi không tìm thấy file.
  t114: read_file tự loại bỏ nội dung trùng lặp — đọc lại file chưa thay đổi sẽ chỉ trả về kết quả rút gọn.
  t115: Đặt browser.user_data_dir thành một thư mục để giữ profile Chromium lâu dài, giúp bạn duy trì đăng nhập giữa các phiên.
  t116: browser.chromium_args thêm các flag Chromium vào phiên trình duyệt trên máy, ví dụ --lang=de.
  t117: image_generate tạo ảnh bằng FLUX 2 Pro và tự động nâng độ phân giải lên 2x.
  t118: text_to_speech chuyển văn bản thành âm thanh — phát dưới dạng tin nhắn thoại trên Telegram.
  t119: send_message có thể gửi tin nhắn đến mọi nền tảng nhắn tin đã kết nối ngay trong một phiên.
  t120: Công cụ todo giúp agent theo dõi các tác vụ phức tạp gồm nhiều bước trong một phiên.
  t121: session_search tìm kiếm toàn văn trong TẤT CẢ cuộc trò chuyện trước đây.
  t122: Agent tự động lưu các tùy chọn, góp ý chỉnh sửa và thông tin về môi trường vào bộ nhớ.
  t123: /moa đưa một prompt khó qua bộ model Mixture of Agents bạn đã cấu hình.
  t124: Lệnh terminal hỗ trợ chạy nền với notify_on_complete cho các tác vụ chạy lâu.
  t125: Tiến trình terminal chạy nền hỗ trợ watch_patterns để báo khi xuất hiện các dòng đầu ra cụ thể.
  t126: 'Công cụ terminal hỗ trợ 6 backend: local, Docker, SSH, Modal, Daytona và Singularity.'
  t127: Mỗi profile có config, API key, bộ nhớ, phiên, skill và tác vụ cron riêng.
  t128: Tên profile trở thành lệnh shell — 'vibervnbot profile create coder' tạo lệnh 'coder'.
  t129: vibervnbot profile export coder -o backup.tar.gz tạo một bản lưu trữ profile có thể chuyển sang nơi khác.
  t130: Nếu hai profile vô tình dùng chung bot token, gateway thứ hai sẽ bị chặn kèm thông báo lỗi rõ ràng.
  t131: Phiên tự động có tiêu đề mô tả sau lượt trao đổi đầu tiên — bạn không cần đặt tên thủ công.
  t132: 'Tiêu đề phiên hỗ trợ đánh số nối tiếp: "dự án của tôi" → "dự án của tôi #2" → "dự án của tôi #3".'
  t133: Khi thoát, ViberVN Bot hiển thị lệnh tiếp tục phiên kèm ID phiên và số liệu thống kê.
  t134: vibervnbot sessions export backup.jsonl xuất tất cả phiên để sao lưu hoặc phân tích.
  t135: vibervnbot -r SESSION_ID tiếp tục một phiên trước đây theo ID của phiên đó.
  t136: Bộ nhớ là một bản chụp cố định — các thay đổi chỉ xuất hiện trong system prompt khi bắt đầu phiên tiếp theo.
  t137: Các mục trong bộ nhớ được tự động quét để phát hiện dấu hiệu prompt injection và đánh cắp dữ liệu.
  t138: 'Agent có hai vùng lưu bộ nhớ: ghi chú cá nhân (~2200 ký tự) và hồ sơ người dùng (~1375 ký tự).'
  t139: Những lời bạn chỉnh lại cho agent ("không, làm theo cách này") thường được tự động lưu vào bộ nhớ.
  t140: Có hơn 80 skill đi kèm, bao gồm github, sáng tạo, mlops, năng suất, nghiên cứu và nhiều lĩnh vực khác.
  t141: Mỗi skill đã cài đặt tự động trở thành một lệnh slash — gõ / để xem tất cả.
  t142: vibervnbot skills install official/security/1password cài các skill tùy chọn từ repo.
  t143: Skill có thể chỉ hỗ trợ một số hệ điều hành — có skill chỉ tải trên macOS hoặc Linux.
  t144: skills.external_dirs trong config.yaml cho phép bạn tải skill từ các thư mục tùy chỉnh.
  t145: Agent có thể tự tạo skill làm bộ nhớ quy trình bằng skill_manage.
  t146: /plan ghi kế hoạch triển khai dạng markdown vào .vibervnbot/plans/ mà không thực thi gì.
  t147: 'Bạn có thể gắn skill cho tác vụ cron: vibervnbot cron add --skill blogwatcher "Check for new posts".'
  t148: Cron có thể gửi kết quả đến telegram, discord, slack, email, sms và hơn 12 nền tảng khác.
  t149: Nếu phản hồi của tác vụ cron bắt đầu bằng [SILENT], kết quả sẽ không được gửi — hữu ích cho tác vụ chỉ theo dõi.
  t150: Cron hỗ trợ thời gian trễ tương đối (30m), chu kỳ (every 2h), biểu thức cron và dấu thời gian ISO.
  t151: Tác vụ cron chạy trong phiên agent hoàn toàn mới — prompt phải có đủ thông tin cần thiết.
  t152: Chế độ giọng nói không cần API key nếu đã cài faster-whisper (chuyển giọng nói thành văn bản miễn phí ngay trên máy).
  t153: 'Có 5 nhà cung cấp TTS: Edge TTS (miễn phí), ElevenLabs, OpenAI, NeuTTS (miễn phí, chạy trên máy), MiniMax.'
  t154: /voice on bật chế độ giọng nói trong CLI. Ctrl+B bật hoặc tắt ghi âm kiểu nhấn để nói.
  t155: TTS dạng streaming phát từng câu ngay khi được tạo — bạn không phải chờ toàn bộ câu trả lời.
  t156: Tin nhắn thoại trên Telegram, Discord, WhatsApp và Slack được tự động chuyển thành văn bản.
  t157: 'ViberVN Bot hoạt động trên 21 nền tảng nhắn tin: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email và nhiều nền tảng khác.'
  t158: vibervnbot gateway install thiết lập gateway thành dịch vụ hệ thống tự khởi động khi bật máy.
  t159: DingTalk dùng Stream Mode — không cần webhook hay URL công khai.
  t160: BlueBubbles kết nối iMessage với ViberVN Bot qua máy chủ macOS chạy trên máy.
  t161: Các tuyến webhook hỗ trợ xác thực HMAC, giới hạn tần suất và lọc sự kiện.
  t162: Máy chủ API cung cấp endpoint tương thích với OpenAI, dùng được với Open WebUI và LibreChat.
  t163: 'Chế độ kênh thoại Discord: bot vào kênh thoại, chuyển lời nói thành văn bản và trả lời bằng giọng nói.'
  t164: 'group_sessions_per_user: true tạo phiên riêng cho từng người trong chat nhóm.'
  t165: /sethome đặt một cuộc chat làm kênh nhận kết quả từ các tác vụ cron.
  t166: Gateway hỗ trợ hết thời gian chờ dựa trên mức độ không hoạt động — agent đang hoạt động có thể chạy vô thời hạn.
  t167: 'Phê duyệt lệnh nguy hiểm có 4 mức: một lần, trong phiên, luôn cho phép (danh sách cho phép vĩnh viễn), từ chối.'
  t168: Chế độ phê duyệt thông minh dùng LLM để tự duyệt lệnh an toàn và đánh dấu lệnh nguy hiểm.
  t169: Cơ chế bảo vệ SSRF chặn mạng riêng, địa chỉ loopback, link-local và địa chỉ metadata của dịch vụ đám mây.
  t170: ID phiên có tiền tố là dấu thời gian (20250305_091523_abcd), nên có thể sắp xếp tự nhiên bằng ls và jq.
  t171: Tiến trình con MCP nhận môi trường đã được lọc — chỉ các biến hệ thống an toàn được truyền vào.
  t172: Các file ngữ cảnh (.vibervnbot.md, AGENTS.md) được quét để phát hiện prompt injection trước khi tải.
  t173: command_allowlist trong config.yaml phê duyệt vĩnh viễn các mẫu lệnh shell cụ thể.
  t174: Ngữ cảnh tự nén khi đạt ngưỡng — bộ nhớ được lưu lại và lịch sử được tóm tắt.
  t175: Thanh trạng thái chuyển sang vàng, rồi cam, rồi đỏ khi ngữ cảnh dần đầy.
  t176: SOUL.md là file định danh chính của agent — hãy tùy chỉnh để định hình cách agent hoạt động.
  t177: ViberVN Bot tải ngữ cảnh dự án từ .vibervnbot.md, AGENTS.md, CLAUDE.md hoặc .cursorrules (file khớp đầu tiên).
  t178: Các file AGENTS.md trong thư mục con được tìm dần khi agent đi vào từng thư mục.
  t179: Các tệp ngữ cảnh được giới hạn ở 20.000 ký tự, với cơ chế cắt bớt thông minh ở đầu/cuối.
  t180: 'Các backend trình duyệt: Chromium cục bộ, Lightpanda, Browserbase, Browser Use và Firecrawl — cùng với Camofox dưới dạng plugin.'
  t181: 'Camofox (Firefox chống phát hiện) giờ là một plugin: vibervnbot plugins install camofox.'
  t182: browser_exec chạy nhiều bước trình duyệt trong một lần gọi Python — điều hướng, trích xuất và nhấp cùng lúc.
  t183: 'browser.dialog_policy quy định cách xử lý hộp thoại gốc của trang: must_respond (agent trả lời bằng browser_dialog), auto_dismiss hoặc auto_accept.'
  t184: vibervnbot mcp mở danh sách chọn MCP tương tác để bạn cài đặt chỉ bằng một phím.
  t185: vibervnbot mcp catalog liệt kê các máy chủ MCP đi kèm repo.
  t186: vibervnbot mcp install <name> cài một mục trong catalog, yêu cầu thông tin xác thực và cho bạn chọn các công cụ muốn bật.
  t187: Máy chủ MCP được cấu hình trong config.yaml — hỗ trợ cả phương thức truyền tải stdio và HTTP.
  t188: 'Lọc công cụ theo từng máy chủ: tools.include cho phép và tools.exclude chặn các công cụ cụ thể.'
  t189: Máy chủ MCP tự tạo bộ công cụ khi chạy — vibervnbot tools có thể bật hoặc tắt chúng theo từng nền tảng.
  t190: 'Hỗ trợ MCP OAuth: auth: oauth bật xác thực qua trình duyệt bằng PKCE.'
  t191: Checkpoint không tốn thêm tài nguyên khi không có file nào bị sửa — được bật theo mặc định.
  t192: Một bản snapshot được lưu tự động trước khi rollback để bạn có thể hoàn tác thao tác hoàn tác.
  t193: /rollback cũng hoàn tác lượt trò chuyện, nên agent không nhớ những thay đổi đã bị rollback.
  t194: Checkpoint dùng các repo riêng trong ~/.vibervnbot/checkpoints/ — không đụng đến .git của dự án bạn.
  t195: batch_runner.py xử lý song song hàng trăm prompt để tạo dữ liệu huấn luyện.
  t196: vibervnbot chat -Q bật chế độ yên lặng khi dùng qua chương trình — ẩn banner và hiệu ứng chờ.
  t197: Tùy chọn lưu quá trình (--save-trajectories) ghi lại toàn bộ các bước dùng công cụ để huấn luyện model.
  t198: 'Ba loại plugin: thông thường (công cụ/hook), trình cung cấp bộ nhớ và bộ máy ngữ cảnh.'
  t199: vibervnbot plugins install owner/repo cài plugin trực tiếp từ GitHub.
  t200: Các nhà cung cấp bộ nhớ ngoài gồm Honcho, Hindsight, Mem0, OpenViking và nhiều lựa chọn khác, cài qua vibervnbot plugins install.
  t201: Các hook của plugin gồm pre/post_tool_call, pre/post_llm_call và transform_terminal_output để chuẩn hóa đầu ra.
  t202: Bộ nhớ đệm prompt (Anthropic) giảm chi phí bằng cách dùng lại phần đầu prompt hệ thống đã lưu.
  t203: Agent tự tạo tiêu đề phiên trong luồng chạy nền — không làm tăng thời gian phản hồi.
  t204: Tính năng định tuyến model thông minh có thể tự chuyển câu hỏi đơn giản sang model rẻ hơn.
  t205: 'Lệnh slash hỗ trợ khớp tiền tố: /h được hiểu là /help, /mod là /model.'
  t206: Kéo đường dẫn tệp vào terminal sẽ tự đính kèm ảnh hoặc gửi tệp làm ngữ cảnh.
  t207: .worktreeinclude ở thư mục gốc repo liệt kê các tệp bị git bỏ qua cần sao chép vào worktree.
  t208: vibervnbot acp chạy ViberVN Bot dưới dạng máy chủ ACP để tích hợp với VS Code, Zed và JetBrains.
  t209: 'Nhà cung cấp tùy chỉnh: lưu các endpoint có tên trong config.yaml, dưới custom_providers.'
  t210: VIBERVNBOT_EPHEMERAL_SYSTEM_PROMPT thêm một prompt hệ thống không bao giờ được lưu vào lịch sử.
  t211: credential_pool_strategies hỗ trợ các cách luân phiên fill_first, round_robin, least_used và random.
  t212: vibervnbot auth add openai-codex thiết lập nhà cung cấp dùng OAuth.
  t213: Máy chủ API hỗ trợ cả Chat Completions và Responses API, với trạng thái được lưu ở phía máy chủ.
  t214: 'tool_preview_length: 0 trong config hiển thị đầy đủ đường dẫn tệp trong phần hoạt động của hiệu ứng chờ.'
  t215: vibervnbot status --deep chạy kiểm tra chẩn đoán chuyên sâu trên mọi thành phần.
  t216: Tác vụ cron có thể đính kèm một script Python (--script); stdout của script sẽ được thêm vào prompt làm ngữ cảnh.
  t217: Script cron nằm trong ~/.vibervnbot/scripts/ và chạy trước agent — rất hợp cho quy trình thu thập dữ liệu.
  t218: prefill_messages_file trong config.yaml chèn các ví dụ few-shot vào mỗi lần gọi API, nhưng không lưu vào lịch sử.
  t219: SOUL.md thay thế hoàn toàn danh tính mặc định của agent — viết lại để ViberVN Bot mang phong cách của bạn.
  t220: Ở lần chạy đầu, SOUL.md tự được tạo với tính cách mặc định. Hãy sửa file này để tùy chỉnh.
  t221: /compress <focus topic> dành 60-70% dung lượng bản tóm tắt cho chủ đề của bạn và cắt gọn mạnh tay phần còn lại.
  t222: Từ lần nén thứ hai trở đi, bộ nén cập nhật bản tóm tắt trước đó thay vì làm lại từ đầu.
  t223: Trước khi đặt lại phiên gateway, ViberVN Bot tự lưu các thông tin quan trọng vào bộ nhớ ở chế độ nền.
  t224: 'network.force_ipv4: true trong config.yaml khắc phục tình trạng treo trên máy chủ có IPv6 bị lỗi — bằng cách vá socket khi chạy.'
  t225: 'Công cụ terminal chú thích các mã thoát thường gặp: grep trả về 1 = ''Không tìm thấy kết quả (không phải lỗi)''.'
  t226: Lệnh terminal chạy trực tiếp bị lỗi sẽ tự thử lại tối đa 3 lần, với thời gian chờ tăng dần (2s, 4s, 8s).
  t227: Các lệnh sudo thông thường được tự viết lại để chuyển SUDO_PASSWORD từ .env vào — không cần nhập mật khẩu thủ công.
  t228: 'Các hàm hỗ trợ của execute_code cần được import tường minh: from vibervnbot_tools import json_parse, shell_quote, retry.'
  t229: 7 công cụ trong môi trường cách ly của execute_code (web_search, terminal, read/write/search/patch) dùng RPC — không bao giờ đi vào ngữ cảnh.
  t230: Đọc cùng một đoạn file từ 3 lần trở lên sẽ bị cảnh báo. Từ 4 lần trở lên, thao tác sẽ bị chặn hẳn để tránh lặp vô hạn.
  t231: write_file và patch phát hiện khi file bị sửa từ bên ngoài sau lần đọc gần nhất và cảnh báo rằng nội dung có thể đã cũ.
  t232: Định dạng patch V4A hỗ trợ các chỉ thị Add File, Delete File và Move File — không chỉ Update.
  t233: Máy chủ MCP có thể yêu cầu LLM tạo phản hồi ngược lại qua sampling — agent trở thành công cụ cho máy chủ.
  t234: Máy chủ MCP gửi notifications/tools/list_changed để tự động đăng ký lại công cụ mà không cần khởi động lại.
  t235: 'delegate_task với acp_command: ''claude'' khởi chạy Claude Code làm agent con từ bất kỳ nền tảng nào.'
  t236: Tác vụ được ủy quyền có luồng heartbeat — hoạt động của agent con được báo cho agent cha, giúp gateway không bị hết thời gian chờ.
  t237: Khi một nhà cung cấp trả về HTTP 402 (cần thanh toán), ứng dụng phụ trợ tự chuyển sang nhà cung cấp tiếp theo.
  t238: agent.tool_use_enforcement hướng các model hay mô tả hành động sang gọi công cụ — tự động áp dụng cho GPT/Codex.
  t239: agent.restart_after_turn_timeout cho phép các lượt đang xử lý hoàn tất trước khi /restart gọi stop(); restart_drain_timeout chỉ là thời gian chờ trước khi buộc ngắt sau khi stop() bắt đầu.
  t240: agent.api_max_retries (mặc định 3) quy định số lần agent thử lại một lệnh gọi API bị lỗi trước khi báo lỗi cho bạn — giảm giá trị này để chuyển sang phương án khác nhanh hơn.
  t241: gateway lưu đệm các phiên bản AIAgent theo từng phiên — xóa bộ đệm này sẽ làm hỏng cơ chế lưu đệm prompt của Anthropic.
  t242: Website nào cũng có thể cung cấp skill qua /.well-known/skills/index.json — hub skill sẽ tự động tìm thấy chúng.
  t243: Nhật ký kiểm tra skill tại ~/.vibervnbot/skills/.hub/audit.log ghi lại mọi lần cài đặt và gỡ bỏ.
  t244: 'Các git worktree cũ được tự động dọn dẹp: worktree sạch đã được merge sẽ bị xóa; worktree không hoạt động nhưng có thay đổi chưa commit hoặc chưa push sẽ được lưu trữ trước và có thể khôi phục bằng vibervnbot worktree restore.'
  t245: Profile tách biệt trạng thái ViberVN Bot qua VIBERVNBOT_HOME; các tiến trình con của công cụ trên máy vẫn dùng HOME thực của bạn, trừ khi terminal.home_mode là profile.
  t246: Biến môi trường VIBERVNBOT_HOME_MODE (dạng bát phân, ví dụ 0701) đặt quyền thư mục tùy chỉnh để web server có thể truy cập thư mục.
  t247: 'Chế độ container: đặt .container-mode trong VIBERVNBOT_HOME để CLI trên máy tự chạy trong container.'
  t248: 'Ctrl+C có 5 mức ưu tiên: hủy ghi âm → hủy prompt → đóng bộ chọn → ngắt agent → thoát.'
  t249: Mỗi lần ngắt khi agent đang chạy đều được ghi vào ~/.vibervnbot/interrupt_debug.log kèm thời gian.
  t250: BROWSER_CDP_URL kết nối công cụ trình duyệt với bất kỳ trình duyệt nào thuộc họ Chromium đang chạy — hỗ trợ WebSocket, HTTP hoặc host:port.
  t251: BROWSERBASE_ADVANCED_STEALTH=true bật tính năng chống phát hiện nâng cao bằng Chromium tùy chỉnh (Scale Plan).
  t252: CLI tự chuyển sang chế độ gọn khi terminal hẹp hơn 80 cột.
  t253: 'Lệnh nhanh có hai loại: exec (chạy lệnh shell trực tiếp) và alias (chuyển sang lệnh khác).'
  t254: 'Chọn model cho từng tác vụ được giao: delegation.model và delegation.provider trong config chuyển subagent sang model rẻ hơn.'
  t255: delegation.reasoning_effort điều chỉnh riêng độ sâu suy luận của subagent.
  t256: 'display.platforms trong config.yaml cho phép tùy chỉnh hiển thị theo từng nền tảng: {telegram: {tool_progress: all}}.'
  t257: human_delay.mode trong config mô phỏng tốc độ gõ của người — có thể chỉnh khoảng min_ms/max_ms.
  t258: Việc chuyển đổi phiên bản config tự chạy khi tải — các khóa config mới xuất hiện mà bạn không cần thao tác thủ công.
  t259: Các model GPT và Codex nhận hướng dẫn riêng trong system prompt về cách dùng công cụ đúng quy tắc và các trường hợp bắt buộc dùng công cụ.
  t260: Các model Gemini nhận hướng dẫn riêng về đường dẫn tuyệt đối, gọi công cụ song song và lệnh không cần tương tác.
  t261: Bạn có thể đặt context.engine trong config.yaml thành tên plugin để dùng cách quản lý ngữ cảnh khác.
  t262: Khi dùng trình duyệt đám mây, URL localhost và LAN sẽ mở trong Chromium cục bộ thay thế (browser.auto_local_for_private_urls, bật mặc định).
  t263: 'Bộ nén chạy một lượt sơ bộ ít tốn tài nguyên: đầu ra công cụ dài hơn 200 ký tự được thay bằng placeholder trước khi LLM chạy.'
  t264: Nếu nén thất bại, các lần thử tiếp theo sẽ tạm dừng 10 phút để tránh gửi dồn dập yêu cầu tới API.
  t265: Lệnh nguy hiểm dài (>70 ký tự) có tùy chọn 'view' trong prompt phê duyệt để bạn xem toàn bộ lệnh trước.
  t266: Khi ghi âm giọng nói, mức âm thanh được hiển thị bằng các thanh ▁▂▃▄▅▆▇ dựa trên mức RMS của micro.
  t267: Tên profile không được trùng với lệnh có sẵn trong PATH — 'vibervnbot profile create ls' sẽ bị từ chối.
  t268: vibervnbot profile create backup --clone-all sao chép mọi thứ (config, key, SOUL.md, bộ nhớ, skill, phiên).
  t269: Bạn có thể đổi phím ghi âm bằng voice.record_key trong config.yaml — không chỉ dùng Ctrl+B.
  t270: Các tệp .cursorrules và .cursor/rules/*.mdc được tự động phát hiện và tải làm ngữ cảnh dự án.
  t271: Tệp ngữ cảnh có thể chứa hơn 10 kiểu tấn công chèn prompt — Unicode vô hình, yêu cầu 'bỏ qua chỉ dẫn', cố lấy cắp dữ liệu.
  t272: GPT-5 và Codex dùng vai trò 'developer' thay vì 'system' trong định dạng tin nhắn.
  t273: Bạn có thể ghi đè thiết lập phụ cho từng tác vụ qua auxiliary.vision.provider, auxiliary.compression.model, v.v. trong config.yaml.
  t274: Client phụ coi 'main' là bí danh của provider — và chuyển thành provider chính cùng model bạn đang dùng.
  t275: vibervnbot import-agent openclaw --dry-run cho bạn xem trước quá trình chuyển từ OpenClaw mà không ghi bất kỳ dữ liệu nào.
  t276: Đường dẫn tệp được dán kèm dấu ngoặc kép hoặc dấu cách đã escape sẽ được xử lý tự động — bạn không cần sửa thủ công.
  t277: Slash command không bao giờ bị rút gọn như đoạn văn bản dán dài — /command với đối số lớn vẫn hoạt động bình thường.
  t278: Ở chế độ ngắt, slash command bạn nhập khi agent đang chạy sẽ bỏ qua cơ chế ngắt và chạy ngay.
  t279: VIBERVNBOT_DEV=1 bỏ qua bước phát hiện chế độ container khi phát triển trên máy cục bộ.
  t280: Mỗi MCP server có bộ công cụ riêng (mcp-servername), có thể bật tắt độc lập qua vibervnbot tools.
  t281: Các placeholder ${ENV_VAR} của MCP trong config được thay bằng giá trị khi khởi chạy server — kể cả biến từ ~/.vibervnbot/.env.
  t282: Skill từ repo đáng tin cậy được gán mức bảo mật 'trusted'; skill cộng đồng được quét kỹ hơn.
  t283: Khu cách ly skill tại ~/.vibervnbot/skills/.hub/quarantine/ chứa các skill đang chờ kiểm tra bảo mật.
  t284: /steer <prompt> chèn ghi chú sau lần gọi công cụ tiếp theo — giúp bạn điều chỉnh hướng xử lý giữa chừng mà không cần ngắt.
  t285: /goal <text> đặt mục tiêu dài hạn cho vòng lặp Ralph — ViberVN Bot tự tiếp tục qua nhiều lượt cho đến khi bộ đánh giá xác nhận hoàn tất.
  t286: /snapshot create [label] lưu ảnh chụp toàn bộ trạng thái config của ViberVN Bot; /snapshot restore <id> khôi phục lại sau.
  t288: /redraw vẽ lại toàn bộ giao diện, khắc phục lỗi hiển thị terminal sau khi đổi kích thước tmux hoặc chọn văn bản bằng chuột.
  t289: /agents (bí danh /tasks) hiển thị các agent đang hoạt động và tác vụ nền đang chạy trong phiên hiện tại.
  t290: /footer bật hoặc tắt phần chân trang gateway trong câu trả lời cuối, hiển thị model, % ngữ cảnh và cwd.
  t291: /busy queue|steer|interrupt điều khiển tác dụng của phím Enter khi ViberVN Bot đang xử lý.
  t292: /topic trong tin nhắn riêng Telegram bật chế độ nhiều phiên theo chủ đề do bạn quản lý — /topic <id> mở lại phiên trước ngay trong cuộc trò chuyện.
  t293: /approve session|always chạy lệnh nguy hiểm đang chờ theo phạm vi tin cậy bạn chọn; /deny từ chối lệnh đó.
  t294: /restart khởi động lại gateway sau khi các tác vụ đang chạy hoàn tất, rồi báo cho người yêu cầu khi gateway hoạt động trở lại.
  t295: /kanban boards switch <slug> đổi bảng Kanban đa dự án đang dùng ngay trong chat.
  t296: /reload nạp lại ~/.vibervnbot/.env vào phiên đang chạy — dùng API key mới mà không cần khởi động lại.
  t297: cronjob với no_agent=True chạy script theo lịch và gửi trực tiếp stdout — không tốn token, không dùng LLM.
  t298: Nếu stdout của script cron trống, lượt chạy sẽ không gửi gì — rất hợp để theo dõi ngưỡng.
  t299: VIBERVNBOT_CRON_MAX_PARALLEL (mặc định 4) giới hạn số cron job chạy mỗi lượt để các đợt chạy dồn không làm quá tải API key của bạn.
  t300: Gateway hook nằm trong ~/.vibervnbot/hooks/<name>/ với HOOK.yaml + handler.py — hàm xử lý phải tên là `handle`.
  t301: Các sự kiện hook gồm gateway:startup, session:start, agent:step và đăng ký theo ký tự đại diện command:*.
  t302: Tạo danh sách việc cần làm tại ~/.vibervnbot/BOOT.md; hook gateway:startup sẽ chạy danh sách đó bằng một agent một lần mỗi khi khởi động.
  t303: vibervnbot curator run --dry-run cho bạn xem trước curator sẽ lưu trữ hoặc gộp những gì mà không thay đổi gì.
  t304: vibervnbot curator pin <skill> bảo vệ skill khỏi cả việc tự động lưu trữ lẫn công cụ skill_manage của agent.
  t305: vibervnbot curator rollback khôi phục skill từ bản chụp trước khi chạy — bản sao lưu nằm trong skills/.curator_backups/.
  t306: vibervnbot auth reset <provider> [target] xóa trạng thái chờ và cờ hết lượt của cả nhóm thông tin xác thực, hoặc của một mục theo chỉ số, id hay nhãn.
  t307: 'credential_pool_strategies.<provider>: round_robin luân phiên dùng các key đều nhau thay vì mặc định fill_first.'
  t308: Bạn có thể ghi đè provider cho từng công cụ trong config.yaml để chuyển tác vụ web, image, tts hoặc browser sang các provider khác nhau.
  t309: 'provider_routing.data_collection: deny loại trừ các provider lưu trữ dữ liệu trên OpenRouter.'
  t310: 'provider_routing.require_parameters: true chỉ chuyển yêu cầu đến provider hỗ trợ mọi tham số bạn gửi.'
  t311: VIBERVNBOT_TUI_RESUME=1 tự kết nối lại với phiên TUI gần nhất khi khởi chạy — tiện khi kết nối SSH bị ngắt.
  t312: VIBERVNBOT_TUI_THEME=light|dark|<hex> ép giao diện TUI dùng theme đã chọn trên terminal không đặt COLORFGBG.
  t313: Ctrl+G hoặc Ctrl+X Ctrl+E trong TUI mở nội dung đang nhập bằng $EDITOR để bạn viết prompt dài, nhiều dòng.
  t314: TUI hiển thị LaTeX ngay trong dòng — $E=mc^2$ thành ký hiệu toán Unicode thay vì mã TeX thô.
  t315: vibervnbot dashboard mở giao diện web cục bộ tại 127.0.0.1:9130 — không dữ liệu nào rời khỏi localhost.
  t316: vibervnbot dashboard hiển thị toàn bộ TUI của ViberVN Bot trong trình duyệt qua xterm.js và WebSocket PTY.
  t317: Thêm một tệp YAML vào ~/.vibervnbot/dashboard-themes/ với hai màu chủ đạo để đổi giao diện toàn bộ dashboard.
  t318: Plugin dashboard chỉ cần thả vào ~/.vibervnbot/dashboard-plugins/ với manifest.json + gói JS — không cần build bằng npm.
  t319: 'layoutVariant: cockpit trong theme dashboard thêm thanh bên trái rộng 260px để plugin hiển thị nội dung qua sidebar slot.'
  t320: 'display.tool_progress_command: true cho phép dùng /verbose trên các nền tảng nhắn tin; mặc định lệnh này chỉ có trên CLI.'
  t321: VIBERVNBOT_BACKGROUND_NOTIFICATIONS=result chỉ báo khi tác vụ nền hoàn tất (thay vì concise/all/error/off).
  t322: 'VIBERVNBOT_WRITE_SAFE_ROOT giới hạn write_file/patch trong các thư mục cho phép; nhập nhiều đường dẫn bằng os.pathsep (: hoặc ;).'
  t323: VIBERVNBOT_IGNORE_RULES bỏ qua việc tự động nạp AGENTS.md, SOUL.md, .cursorrules, bộ nhớ và các skill nạp sẵn.
  t324: VIBERVNBOT_ACCEPT_HOOKS tự động phê duyệt các shell hook chưa từng gặp được khai báo trong config.yaml mà không cần hỏi qua TTY.
  t325: auxiliary.goal_judge.model chuyển bộ đánh giá /goal sang model nhanh, chi phí thấp để chi phí vòng lặp gần như bằng không.
  t326: Checkpoint bỏ qua thư mục có hơn 50.000 tệp để tránh các thao tác git chậm trên monorepo lớn.
  t327: 'tts.provider: piper chạy TTS cục bộ hỗ trợ 44 ngôn ngữ trên CPU — giọng đọc tự tải về ~/.vibervnbot/cache/piper-voices/.'
  t328: 'tts.providers.<name>.type: command kết nối với bất kỳ công cụ TTS qua CLI nào bằng các placeholder {input_path} và {output_path}.'
  t329: API_SERVER_ENABLED=true chạy một endpoint tương thích OpenAI cùng với gateway để dùng với Open WebUI và LibreChat.
  t330: 'GATEWAY_PROXY_URL cho phép chạy tách biệt: xử lý I/O của nền tảng tại máy, giao việc cho agent qua API server từ xa.'
  t331: MATRIX_DEVICE_ID cố định ID thiết bị cho E2EE — nếu không có, khóa sẽ đổi sau mỗi lần khởi động và không giải mã được dữ liệu cũ.
  t332: Bạn phải đặt TELEGRAM_WEBHOOK_SECRET khi dùng TELEGRAM_WEBHOOK_URL — tạo bằng openssl rand -hex 32.
  t333: batch_runner.py --resume đối chiếu các prompt đã hoàn tất theo nội dung, nên việc đổi thứ tự dataset sẽ không khiến tác vụ đã xong chạy lại.
  t334: /new bắt đầu phiên mới ngay tại đây (bí danh /reset) — ID phiên mới, lịch sử trống, CLI vẫn mở.
  t335: /clear xóa màn hình terminal VÀ bắt đầu phiên mới — một lệnh để làm mới cả giao diện.
  t336: /history hiển thị cuộc trò chuyện hiện tại ngay trong CLI — tiện xem lại nhanh.
  t337: /save lưu cuộc trò chuyện hiện tại vào ổ đĩa mà không kết thúc phiên.
  t338: '/status cho bạn xem nhanh thông tin phiên: ID, tiêu đề, model, lượng token đã dùng và thời gian đã trôi qua.'
  t339: /image <path> đính kèm ảnh trên máy vào prompt tiếp theo mà không cần dán hay kéo thả.
  t340: /platforms cho bạn xem trạng thái kết nối gateway và các nền tảng nhắn tin ngay trong chat.
  t341: /commands hiển thị danh sách đầy đủ các lệnh slash và skill đã cài theo từng trang — hữu ích trên nền tảng không hỗ trợ hoàn thành lệnh bằng Tab.
  t342: /toolsets liệt kê mọi toolset có sẵn để bạn biết -t/--toolsets nhận những giá trị nào.
  t343: /voice tts bật/tắt chế độ chỉ dùng TTS — agent trả lời bằng giọng nói, còn bạn vẫn nhập prompt.
  t344: /reload-skills quét lại ~/.vibervnbot/skills/ để skill mới xuất hiện mà không cần khởi động lại phiên.
  t345: /indicator kaomoji|emoji|unicode|ascii chọn kiểu chỉ báo bận của TUI khi agent đang chạy.
  t346: /debug tải lên gói hỗ trợ (thông tin hệ thống + log) và trả về các liên kết có thể chia sẻ — dùng được cả trong chat.
  t347: 'vibervnbot -z "<prompt>" là cách chạy một lần gọn nhất: chỉ xuất câu trả lời cuối cùng ra stdout — rất tiện để dùng với pipe trong script.'
  t348: vibervnbot chat --pass-session-id chèn ID phiên vào system prompt để agent có thể tự tham chiếu đến phiên đó.
  t349: vibervnbot chat --image path/to/pic.png đính kèm ảnh trên máy vào một truy vấn -q mà không cần tải ảnh lên riêng.
  t350: vibervnbot chat --ignore-user-config bỏ qua cấu hình người dùng đang dùng — tiện để báo lỗi có thể tái hiện và chạy CI.
  t351: vibervnbot chat --source tool gắn nhãn cho các cuộc chat được tạo bằng chương trình để chúng không làm rối danh sách vibervnbot sessions.
  t352: vibervnbot dump --show-keys thêm dấu nhận dạng API key đã che bớt để hỗ trợ gỡ lỗi chuyên sâu.
  t353: vibervnbot sessions rename <ID> "new title" đổi tên một phiên cũ; vibervnbot sessions delete <ID> xóa một phiên.
  t354: vibervnbot import khôi phục bản sao lưu zip đầy đủ của ViberVN Bot; để nhập bản xuất phiên JSON/JSONL, hãy dùng trang Sessions trên dashboard.
  t355: vibervnbot fallback giúp bạn quản lý chuỗi fallback_model theo cách tương tác — không cần tự sửa config.yaml.
  t356: vibervnbot pairing tạo lại token ghép nối qua DM — người đầu tiên nhắn tin sau đó sẽ được cấp quyền truy cập bot.
  t357: vibervnbot setup hướng dẫn người dùng mới thiết lập provider, key và kết nối nền tảng trong một quy trình tương tác.
  t358: vibervnbot status --deep kiểm tra tình trạng đầy đủ của mọi thành phần; vibervnbot status cho bạn xem nhanh.
  t359: VIBERVNBOT_AGENT_TIMEOUT=0 tắt cơ chế gateway dừng agent khi không hoạt động — dùng cho các tác vụ nghiên cứu dài.
  t360: VIBERVNBOT_ENABLE_PROJECT_PLUGINS=1 tự động tải plugin trong repo từ ./.vibervnbot/plugins/ — chỉ khi repo được tin cậy.
  t361: VIBERVNBOT_DISABLE_FILE_STATE_GUARD=1 tắt cơ chế kiểm tra 'tệp đã thay đổi kể từ khi bạn đọc' khi dùng patch và write_file.
  t362: VIBERVNBOT_ALLOW_PRIVATE_URLS=true cho phép công cụ web truy cập localhost và mạng riêng — mặc định tắt ở chế độ gateway.
  t363: VIBERVNBOT_OPTIONAL_SKILLS=name1,name2 tự động cài thêm skill từ danh mục tùy chọn trong lần chạy đầu tiên của mỗi profile.
  t364: VIBERVNBOT_BUNDLED_SKILLS trỏ đến cây skill đi kèm tùy chỉnh — dùng khi đóng gói bằng Homebrew và Nix.
  t365: VIBERVNBOT_DUMP_REQUEST_STDOUT=1 xuất nội dung mọi yêu cầu API ra stdout thay vì tệp log.
  t366: VIBERVNBOT_OAUTH_TRACE=1 ghi log các lần trao đổi và làm mới token OAuth (đã che thông tin nhạy cảm) để gỡ lỗi xác thực provider.
  t367: VIBERVNBOT_STREAM_RETRIES (mặc định 3) quy định số lần thử kết nối lại giữa luồng khi gặp lỗi mạng tạm thời.
  t368: VIBERVNBOT_GATEWAY_BUSY_ACK_ENABLED=false tắt các tin nhắn xác nhận ⚡/⏳/⏩ khi bạn nhắn cho agent đang bận.
  t369: VIBERVNBOT_AGENT_NOTIFY_INTERVAL (mặc định 180s) đặt tần suất gateway báo tiến độ khi lượt xử lý kéo dài.
  t370: VIBERVNBOT_RESTART_DRAIN_TIMEOUT (mặc định 900s) giới hạn thời gian /restart chờ các tác vụ đang chạy trước khi buộc khởi động lại.
  t371: VIBERVNBOT_CHECKPOINT_TIMEOUT (mặc định 30s) giới hạn thời gian tạo checkpoint cho hệ thống tệp — hãy tăng lên với monorepo rất lớn.
  t372: 'image_gen.model trong config.yaml chọn model FAL: flux-2/klein, gpt-image-2, nano-banana-pro và các model khác.'
  t373: image_gen.provider chuyển việc tạo ảnh qua một plugin (OpenAI Images, Codex, FAL) thay vì dùng mặc định.
  t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY trỏ tính năng phân tích ảnh đến bất kỳ endpoint nào tương thích với OpenAI.
  t375: API_SERVER_MODEL_NAME tùy chỉnh tên model trên /v1/models — cần thiết khi thiết lập Open WebUI với nhiều profile.
  t376: Các plugin của Dashboard được cung cấp qua /dashboard-plugins/<name>/ — chỉ cần đưa tệp vào ~/.vibervnbot/dashboard-plugins/.
  t377: Mặc định, các cuộc chat có --source tool không hiện trong vibervnbot sessions list — hãy chỉ định --source để xem chúng.
  placeholder:
    p01: Hỏi bất cứ điều gì hoặc nhập / để xem lệnh…
    p02: Tóm tắt nội dung trong thư mục này
    p03: Soạn thư trả lời email mới nhất trong hộp thư đến của tôi
    p04: Lên kế hoạch cho một tính năng rồi xây dựng từng bước
    p05: Tìm và sửa một bài test bị lỗi
    p06: Tìm hiểu chủ đề này và viết bản tóm tắt cho tôi
    p07: Repo này gần đây có gì thay đổi?
    p08: Chuyển các ghi chú này thành danh sách việc cần làm
    p09: Giải thích lỗi này và cách khắc phục
    p10: Đặt lời nhắc hoặc lên lịch cho một tác vụ định kỳ
    p11: Nhập / để xem các lệnh hoặc nhấn Ctrl+P để mở bảng lệnh
plan_usage:
  level_free: Miễn phí
  level_top_tier: Lớn
  resets_in: đặt lại sau {duration}
  resets_soon: sắp đặt lại
  limit_reached: Đã đạt giới hạn {name} · {resets}
  limit_day: hằng ngày
  limit_week: hằng tuần
  limit_month: hằng tháng
  limit_top_tier: model lớn hằng tháng
  then_credits: các model trả phí giờ dùng credit của bạn (trả theo mức sử dụng)
  then_credits_large: Các model lớn giờ dùng credit của bạn (trả theo mức sử dụng)
  then_wait: chỉ dùng được model Free cho đến lúc đó
  then_wait_large: Model lớn tạm ngừng cho đến lúc đó
  large_notice: 'Model lớn: mỗi tin nhắn tiêu tốn nhiều hạn mức gói hơn.'
  large_notice_credits: 'Model lớn: mỗi tin nhắn tốn nhiều credit hơn (trả theo mức sử dụng).'
  large_notice_limit: 'Model lớn: bạn đã dùng hết hạn mức {name} ({resets}).'
  large_notice_limit_stops: 'Model lớn: bạn đã dùng hết hạn mức {name} ({resets}), nên model sẽ không chạy cho đến lúc đó.'
  large_notice_percent: 'Model lớn: mỗi tin nhắn tiêu tốn nhiều hạn mức gói hơn. Hạn mức model lớn hằng tháng: đã dùng {percent}.'
