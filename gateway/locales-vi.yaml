        2. Sau khi nhấp *Allow*, trình duyệt sẽ không tải được `http://localhost:1/?...&code=...`. Đây là điều bình thường.


        3. Sao chép toàn bộ URL không tải được từ thanh địa chỉ của trình duyệt rồi dán vào đây dưới dạng: `/setup-files <PASTE_URL>` (hoặc chỉ giá trị `code=...`).


        Lưu ý: URL này chứa quyền truy cập bạn vừa cấp — hãy giữ riêng tư.'
      start_failed: ❌ Không thể tạo URL OAuth. Hãy kiểm tra log của gateway và xác minh client_secret.json hợp lệ.
      exchange_failed: ❌ Trao đổi token thất bại. Mã có thể đã hết hạn hoặc URL không đúng định dạng. Gửi `/setup-files start` để lấy URL OAuth mới.
      revoke_completed: Đã thu hồi quyền (có thể đã bỏ qua một số bước).
      revoked: Đã thu hồi quyền.
      helper_error: '❌ Lỗi: {error}'
